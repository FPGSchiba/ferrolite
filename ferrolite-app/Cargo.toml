[package]
name = "ferrolite-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ferrolite-app"
path = "src/main.rs"

[[bin]]
name = "bench_browse"
path = "src/bin/bench_browse.rs"

[lints]
workspace = true

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.29"
egui-phosphor = { version = "0.7", features = ["fill"] }
egui-wgpu = "0.29"
wgpu = "22"
ferrolite-jobs = { workspace = true }
ferrolite-catalog = { workspace = true }
ferrolite-color = { workspace = true }
ferrolite-decode = { workspace = true }
ferrolite-export = { workspace = true }
ferrolite-gpu = { workspace = true }
ferrolite-image = { workspace = true }
ferrolite-lens = { workspace = true }
ferrolite-mask = { workspace = true }
ferrolite-pipeline = { path = "../ferrolite-pipeline" }
ferrolite-previews = { workspace = true }
ferrolite-vt = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "tiff", "webp"] }
rayon = { workspace = true }
raw-window-handle = "0.6"
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_ColorSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
# Provides the `ForeignType` trait (`from_ptr`/`as_ptr`) that `core-graphics`'s
# `CGColorSpace` implements; needed to wrap the raw `CGColorSpaceRef` from the
# CGDisplayCopyColorSpace/CGColorSpaceCopyICCData FFI in monitor_profile.rs.
# Version 0.3 unifies with core-graphics 0.24's own foreign-types dependency.
foreign-types-shared = "0.3"

[dev-dependencies]
image = { workspace = true, features = ["png"] }
