[package]
name = "ferrolite-export"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ferrolite-color = { workspace = true }
ferrolite-pipeline = { workspace = true }
# Photo-tier: lens corrections bake off-thread inside the export job via the
# shared `LensDb`. `ferrolite-lens` only pulls in `lensfun` + `thiserror` (no
# engine crates), keeping `lensfun` confined to that crate.
ferrolite-lens = { workspace = true }
ferrolite-gpu = { workspace = true }
ferrolite-image = { workspace = true }
ferrolite-jobs = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "tiff", "webp"] }
fast_image_resize = { workspace = true }
little_exif = { workspace = true }
half = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
# `asm` (a ravif default feature) enables rav1e's NASM-assembly path, whose build
# script hard-panics when NASM is absent. Disable default features and re-enable
# only `threading` to keep AVIF pure-Rust with no C/NASM toolchain. `threading` is
# pure-Rust (rayon) and safe to keep.
ravif = { workspace = true, default-features = false, features = ["threading"] }
zune-jpegxl = { workspace = true }
zune-core = { workspace = true }

[dev-dependencies]
jxl-oxide = { workspace = true }
