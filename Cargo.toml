[workspace]
resolver = "2"
members = ["ferrolite-app", "ferrolite-image", "ferrolite-decode", "ferrolite-catalog", "ferrolite-jobs", "ferrolite-gpu", "ferrolite-vt", "ferrolite-pipeline", "ferrolite-color", "ferrolite-export", "ferrolite-previews", "ferrolite-lens", "ferrolite-mask"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
ferrolite-image = { path = "ferrolite-image" }
ferrolite-decode = { path = "ferrolite-decode" }
ferrolite-catalog = { path = "ferrolite-catalog" }
ferrolite-jobs = { path = "ferrolite-jobs" }
ferrolite-gpu = { path = "ferrolite-gpu" }
ferrolite-vt = { path = "ferrolite-vt" }
ferrolite-pipeline = { path = "ferrolite-pipeline" }
ferrolite-color = { path = "ferrolite-color" }
ferrolite-export = { path = "ferrolite-export" }
ferrolite-previews = { path = "ferrolite-previews" }
ferrolite-lens = { path = "ferrolite-lens" }
ferrolite-mask = { path = "ferrolite-mask" }
little_exif = "0.6"
moxcms = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
pollster = "0.4"
rawler = "0.7.2"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false }
exif = { package = "kamadak-exif", version = "0.6" }
fast_image_resize = "6.0"
rayon = "1.10"
walkdir = "2.5"
thiserror = "2.0"
rfd = "0.15"
# default-features off disables rav1e's NASM `asm` path (no C/NASM toolchain);
# `threading` is re-enabled in ferrolite-export. Set here because a member crate's
# `default-features = false` is ignored unless the workspace entry also opts out.
ravif = { version = "0.11", default-features = false }
zune-jpegxl = "0.4"
zune-core = "0.4"
jxl-oxide = "0.12"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
