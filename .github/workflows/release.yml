name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cargo install cargo-edit --locked
          cargo set-version --package ferrolite-app "$VER"
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        working-directory: ferrolite-app
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo packager --release --formats ${{ matrix.formats }} --target ${{ matrix.target }} --verbose
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find "target/${{ matrix.target }}/release" -maxdepth 1 \( -name '*.dmg' -o -name '*setup.exe' \) -exec cp {} out/ \; 2>/dev/null || true
          # Fallback: default release dir, in case CARGO_BUILD_TARGET routing differs.
          find "target/release" -maxdepth 1 \( -name '*.dmg' -o -name '*setup.exe' \) -exec cp {} out/ \; 2>/dev/null || true
          # cargo-packager names the NSIS installer from the *binary* name
          # (`ferrolite-app`) while the DMG uses the product name (`FerroLite`).
          # Normalize the installer so all assets share the FerroLite_ prefix
          # (and match what the README advertises).
          for f in out/ferrolite-app_*-setup.exe; do
            [ -e "$f" ] || continue
            mv "$f" "out/FerroLite_$(basename "$f" | sed 's/^ferrolite-app_//')"
          done
          ls -la out
          test -n "$(ls -A out 2>/dev/null)" || { echo "no artifacts collected"; exit 1; }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrolite-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # Single publish step so the three matrix jobs never race to create the same
  # release object (softprops/action-gh-release fired in parallel can 422 or drop
  # an asset). Tag builds only; workflow_dispatch stops after `package` and its
  # per-target artifacts are downloadable from the run.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ferrolite-*
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -la dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
